on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          blob_count="$(git ls-files -s | awk '$1 != "160000" {n++} END {print n+0}')"
          submodule_count="$(git ls-files -s | awk '$1 == "160000" {n++} END {print n+0}')"
          echo "Tracked blobs: $blob_count (expected 2401)"
          echo "Tracked submodules: $submodule_count (expected 2)"
          if [ "$blob_count" -ne 2401 ] || [ "$submodule_count" -ne 2 ]; then
            echo "::error::v1.17.7 file-count parity failed"
            exit 1
          fi

          patterns='github\.com/sila-chain/go-sila/sila/|go-ethereum|Etherscan|etherscan|etherbase|gethstore|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|ethdisco\.net|EthClient|ethclient|EthStats|ethstats|RegisterEth|TestEth|Eth([A-Z0-9_]|[^[:alnum:]_]|$)|Geth[A-Z0-9_]|geth[A-Z0-9_]|(^|[^[:alnum:]_])(Ethereum|ethereum|ETHEREUM|Ethash|ethash|EIP[0-9]*|Eip[0-9]*|eip[0-9]*|Sepolia|Holesky|Hoodi|Mainnet|Deneb|Fulu|PeerDAS|Cancun[A-Za-z0-9_]*|Shanghai[A-Za-z0-9_]*|Prague[A-Za-z0-9_]*|Osaka[A-Za-z0-9_]*|Paris[A-Za-z0-9_]*|Amsterdam[A-Za-z0-9_]*|Kovan[A-Za-z0-9_]*|Homestead[A-Za-z0-9_]*|Byzantium[A-Za-z0-9_]*|Constantinople[A-Za-z0-9_]*|Istanbul[A-Za-z0-9_]*|Berlin[A-Za-z0-9_]*|London[A-Za-z0-9_]*|geth)([^[:alnum:]_]|$)|(^|[^[:alnum:]_-])(mainnet|sepolia|holesky|hoodi)([^[:alnum:]_-]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!.mailmap' ':!signer/fourbyte/4byte.json' ':!accounts/usbwallet/ledger.go' ':!graphql/internal/graphiql/graphiql.min.css' ':!graphql/internal/graphiql/graphiql.min.js' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -F 'accounts/usbwallet/trezor/trezor.go:45://go:generate protoc ' | grep -v -F 'github.com/status-im/nimbus-eth2' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

          path_matches="$(git ls-files | grep -E -i '(^|[/_.-])(eip[0-9]*|eth[a-z0-9_-]*|ethereum[a-z0-9_-]*|geth(client)?|sepolia|holesky|hoodi|mainnet)([/_.-]|$)' | grep -E -v -i 'sila[-_](sepolia|holesky|hoodi|mainnet)' | grep -E -v '^docs/audits/' || true)"
          if [ -n "$path_matches" ]; then
            printf '%s\n' "$path_matches"
            echo "::error::Controlled legacy identity path detected"
            exit 1
          fi

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
    env:
      GSIL_MINGW: ${{ matrix.mingw }}
      GSIL_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GSIL_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GSIL_CC% -short -p 8

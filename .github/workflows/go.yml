name: Normalize Sila dependency authority

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-clean-20260917

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Normalize exact dependency authority
        shell: bash
        run: |
          set +e
          set -u
          CURRENT_HEAD="$GITHUB_SHA"
          BRANCH="sila/go-sila-v1.17.5-clean-20260917"
          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"

          python3 <<'PY'
          import subprocess
          from pathlib import Path

          replacements = [
              ("github.com/ethereum/c-kzg-4844/v2", "github.com/sila-chain/c-kzg-4844/v2"),
              ("github.com/ethereum/go-bigmodexpfix", "github.com/sila-chain/go-bigmodexpfix"),
              ("github.com/ethereum/hid", "github.com/sila-chain/hid"),
          ]
          raw = subprocess.check_output(["git", "ls-files", "-z"])
          for item in raw.split(b"\0"):
              if not item:
                  continue
              path = item.decode()
              if path.endswith("go.mod") or path.endswith("go.sum"):
                  continue
              try:
                  data = open(path, "rb").read()
              except (FileNotFoundError, IsADirectoryError):
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  open(path, "wb").write(text.encode("utf-8"))

          # The old blind identity conversion changed the module path in go.sum
          # while retaining checksums from a different module. Remove only those
          # stale rows and let Go/sumdb regenerate authoritative checksums.
          for path in (Path("go.sum"), Path("cmd/keeper/go.sum")):
              if not path.exists():
                  continue
              lines = path.read_text(encoding="utf-8").splitlines(True)
              path.write_text(
                  "".join(
                      line for line in lines
                      if not line.startswith("github.com/crate-crypto/go-eth-kzg v1.5.0")
                  ),
                  encoding="utf-8",
              )
          PY
          if [ $? -ne 0 ]; then exit 1; fi

          go mod edit -droprequire=github.com/ethereum/c-kzg-4844/v2
          go mod edit -droprequire=github.com/ethereum/go-bigmodexpfix
          go mod edit -droprequire=github.com/ethereum/hid
          go mod tidy
          if [ $? -ne 0 ]; then
            echo "ROOT_GO_MOD_TIDY_FAILED"
            exit 1
          fi

          if [ -f cmd/keeper/go.mod ]; then
            (
              cd cmd/keeper || exit 1
              go mod edit -droprequire=github.com/ethereum/c-kzg-4844/v2
              go mod edit -droprequire=github.com/ethereum/go-bigmodexpfix
              go mod edit -droprequire=github.com/ethereum/hid
              go mod tidy
            )
            if [ $? -ne 0 ]; then
              echo "KEEPER_GO_MOD_TIDY_FAILED"
              exit 1
            fi
          fi

          git show "$CURRENT_HEAD^:.github/workflows/go.yml" > .github/workflows/go.yml
          git add -A

          if git grep -n -E 'github.com/ethereum/(c-kzg-4844/v2|go-bigmodexpfix|hid)|github.com/sila-chain/go-sil-kzg|Recsipt|Recsipts' -- ':!vendor' 2>/dev/null; then
            echo "DEPENDENCY_OR_CORRUPTION_GUARD_FAILED"
            exit 1
          fi

          RESULT_TREE="$(git write-tree)"
          RESULT_COMMIT="$(printf '%s\n' 'deps: normalize Sila authority after v1.17.5 sync' | git commit-tree "$RESULT_TREE" -p "$CURRENT_HEAD")"
          echo "RESULT_TREE=$RESULT_TREE"
          echo "RESULT_COMMIT=$RESULT_COMMIT"
          git push origin "$RESULT_COMMIT:refs/heads/$BRANCH"
          if [ $? -ne 0 ]; then
            echo "RESULT_PUSH_FAILED"
            exit 1
          fi

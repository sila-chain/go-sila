on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          patterns='go-ethereum|Etherscan|etherscan|etherbase|gethstore|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|(^|[^[:alnum:]_])(Ethereum|ethereum|ETHEREUM|Ethash|ethash|Sepolia|Holesky|Hoodi|geth)([^[:alnum:]_]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!.mailmap' ':!signer/fourbyte/4byte.json' ':!accounts/usbwallet/ledger.go' ':!accounts/usbwallet/trezor/messages-ethereum.pb.go' ':!accounts/usbwallet/trezor/messages.pb.go' ':!accounts/usbwallet/trezor/messages-ethereum.proto' ':!accounts/usbwallet/trezor/messages.proto' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -F 'accounts/usbwallet/trezor/trezor.go:45://go:generate protoc ' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    needs: lint
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
          - arch: '386'
            mingw: 'C:\mingw32'
            test: false
    env:
      GSIL_MINGW: ${{ matrix.mingw }}
      GSIL_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GSIL_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GSIL_CC% -short -p 8

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          patterns='Ethereum|ethereum|ETHEREUM|go-ethereum|Etherscan|etherscan|etherbase|gethstore|Ethash|ethash|Sepolia|Holesky|Hoodi|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|(^|[^[:alnum:]_])geth([^[:alnum:]_]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!signer/fourbyte/4byte.json' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

  sila-spec-fixtures:
    name: Build Sila execution fixtures
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Sila execution specifications
        uses: actions/checkout@v4
        with:
          repository: sila-chain/execution-specs
          ref: eb555c637db12e11191167d6c6e8217f2a4eb687
          path: execution-specs
          submodules: false

      - name: Set up Sila execution specification tooling
        uses: ./execution-specs/.github/actions/setup-uv
        with:
          enable-cache: "false"

      - name: Generate Sila-native client conformance fixtures
        working-directory: execution-specs
        run: |
          uv sync --no-progress
          sudo apt-get update
          sudo apt-get install -y pigz
          just fill-release --until=BPO4 --generate-all-formats --output=fixtures_go_sila.tar.gz --build-name go-sila

      - name: Upload Sila execution fixtures
        uses: actions/upload-artifact@v4
        with:
          name: sila-execution-fixtures
          path: execution-specs/fixtures_go_sila.tar.gz
          if-no-files-found: error
          retention-days: 7

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: [lint, sila-spec-fixtures]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download Sila execution fixtures
        uses: actions/download-artifact@v4
        with:
          name: sila-execution-fixtures
          path: tests/spec-tests

      - name: Extract Sila execution fixtures
        shell: bash
        run: |
          tar -xzf tests/spec-tests/fixtures_go_sila.tar.gz -C tests/spec-tests
          rm tests/spec-tests/fixtures_go_sila.tar.gz
          test -d tests/spec-tests/fixtures

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests against Sila-native fixtures
        shell: bash
        run: |
          go test -timeout=45m -tags=ckzg,integrationtests -p 8 ./...
          (cd cmd/keeper && go test -timeout=45m -tags=ckzg,integrationtests -p 8 ./...)

  windows:
    name: Windows ${{ matrix.arch }}
    needs: lint
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
          - arch: '386'
            mingw: 'C:\mingw32'
            test: false
    env:
      SILA_MINGW: ${{ matrix.mingw }}
      SILA_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%SILA_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %SILA_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%SILA_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %SILA_CC% -short -p 8

name: Rebuild go-sila v1.17.5

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-rebuild-20260917

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Rebase Sila tree delta onto upstream v1.17.5
        shell: bash
        run: |
          set -u
          SILA_BASE="7a388df6c1afbf78af7b120d7119fe1c363d0a12"
          UPSTREAM_BASE="e5c5e1897d2740b42d7fd77e5730f898543a2649"
          UPSTREAM_LATEST="9621c6ad10934a01b5514886fb6fbd87640b6c05"
          BRANCH="sila/go-sila-v1.17.5-rebuild-20260917"

          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"

          git fetch --no-tags https://github.com/ethereum/go-ethereum.git \
            "$UPSTREAM_BASE" "$UPSTREAM_LATEST"

          git diff --binary --find-renames "$UPSTREAM_BASE" "$SILA_BASE" > /tmp/sila-tree.patch

          git read-tree --reset -u "$UPSTREAM_LATEST"

          if ! git apply --3way --index --whitespace=nowarn /tmp/sila-tree.patch; then
            echo "SILA_REBASE_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U || true
            echo "SILA_REBASE_CONFLICTS_END"
            git status --short
            exit 1
          fi

          git status --short
          git commit -m "sync: rebuild Sila on go-ethereum v1.17.5"
          git push origin "HEAD:$BRANCH"

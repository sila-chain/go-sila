name: Clean rebuild go-sila v1.17.5

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-clean-20260917

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Merge v1.17.5 with token-aware Sila identity
        shell: bash
        run: |
          set +e
          set -u
          SILA_BASE="7a388df6c1afbf78af7b120d7119fe1c363d0a12"
          UPSTREAM_BASE="e5c5e1897d2740b42d7fd77e5730f898543a2649"
          UPSTREAM_LATEST="9621c6ad10934a01b5514886fb6fbd87640b6c05"
          BRANCH="sila/go-sila-v1.17.5-clean-20260917"
          CURRENT_HEAD="$GITHUB_SHA"

          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"
          git config merge.renameLimit 999999

          git fetch --no-tags https://github.com/ethereum/go-ethereum.git \
            "$UPSTREAM_BASE" "$UPSTREAM_LATEST"
          if [ $? -ne 0 ]; then
            echo "UPSTREAM_FETCH_FAILED"
            exit 1
          fi

          SILA_TREE="$(git rev-parse "$SILA_BASE^{tree}")"
          SYNTH="$(printf '%s\n' 'synthetic Sila baseline on upstream parent' | git commit-tree "$SILA_TREE" -p "$UPSTREAM_BASE")"
          git checkout --detach "$SYNTH" || exit 1

          git -c merge.renameLimit=999999 merge --no-commit --no-ff -Xtheirs -Xfind-renames=20% "$UPSTREAM_LATEST"
          MERGE_RC=$?
          if [ "$MERGE_RC" -ne 0 ]; then
            while IFS= read -r -d '' f; do
              if git checkout --theirs -- "$f" 2>/dev/null; then
                git add -- "$f"
              elif git checkout --ours -- "$f" 2>/dev/null; then
                git add -- "$f"
              fi
            done < <(git diff --name-only --diff-filter=U -z)
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "UNRESOLVED_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "UNRESOLVED_CONFLICTS_END"
            exit 1
          fi

          python3 <<'PY'
          import os, re, subprocess, sys

          def tracked():
              raw = subprocess.check_output(["git", "ls-files", "-z"])
              return [p.decode() for p in raw.split(b"\0") if p]

          component_map = {
              "eth": "sil",
              "ethapi": "silapi",
              "ethclient": "silclient",
              "ethstats": "silstats",
              "ethconfig": "silconfig",
              "ethtest": "siltest",
              "geth": "sila",
          }

          paths = tracked()
          tracked_set = set(paths)
          for src in paths:
              parts = src.split("/")
              new_parts = []
              for part in parts:
                  mapped = component_map.get(part, part)
                  mapped = re.sub(r"^eip(?=\d)", "sip", mapped)
                  mapped = re.sub(r"^EIP(?=\d)", "SIP", mapped)
                  new_parts.append(mapped)
              dst = "/".join(new_parts)
              if dst == src:
                  continue
              if dst in tracked_set or os.path.exists(dst):
                  print(f"PATH_COLLISION={src} -> {dst}")
                  sys.exit(2)
              os.makedirs(os.path.dirname(dst) or ".", exist_ok=True)
              subprocess.check_call(["git", "mv", "--", src, dst])
              tracked_set.discard(src)
              tracked_set.add(dst)

          exact = [
              ("github.com/ethereum/go-ethereum/eth/protocols/eth", "github.com/sila-chain/go-sila/sil/protocols/sil"),
              ("github.com/ethereum/go-ethereum/eth/ethconfig", "github.com/sila-chain/go-sila/sil/silconfig"),
              ("github.com/ethereum/go-ethereum/internal/ethapi", "github.com/sila-chain/go-sila/internal/silapi"),
              ("github.com/ethereum/go-ethereum/ethclient", "github.com/sila-chain/go-sila/silclient"),
              ("github.com/ethereum/go-ethereum/ethstats", "github.com/sila-chain/go-sila/silstats"),
              ("github.com/ethereum/go-ethereum/cmd/devp2p/internal/ethtest", "github.com/sila-chain/go-sila/cmd/devp2p/internal/siltest"),
              ("github.com/ethereum/go-ethereum/cmd/geth", "github.com/sila-chain/go-sila/cmd/sila"),
              ("github.com/ethereum/go-ethereum/consensus/misc/eip1559", "github.com/sila-chain/go-sila/consensus/misc/sip1559"),
              ("github.com/ethereum/go-ethereum/eth/", "github.com/sila-chain/go-sila/sil/"),
              ("github.com/ethereum/go-ethereum", "github.com/sila-chain/go-sila"),
              ("cmd/geth", "cmd/sila"),
          ]

          token_rules = [
              (re.compile(r"\bethapi\b"), "silapi"),
              (re.compile(r"\bethclient\b"), "silclient"),
              (re.compile(r"\bethstats\b"), "silstats"),
              (re.compile(r"\bethconfig\b"), "silconfig"),
              (re.compile(r"\bethtest\b"), "siltest"),
              (re.compile(r"\bEIPs\b"), "SIPs"),
              (re.compile(r"\bEIP\b"), "SIP"),
              (re.compile(r"\beips\b"), "sips"),
              (re.compile(r"\beip\b"), "sip"),
              (re.compile(r"\bEIP(?=\d)"), "SIP"),
              (re.compile(r"\beip(?=\d)"), "sip"),
              (re.compile(r"\bETH(?=[A-Z_])"), "SIL"),
              (re.compile(r"\bEth(?=[A-Z_])"), "Sil"),
              (re.compile(r"\beth(?=[A-Z_])"), "sil"),
              (re.compile(r"\bEthereum(?=[A-Z_])"), "Sila"),
              (re.compile(r"\bethereum(?=[A-Z_])"), "sila"),
          ]

          final_paths = sorted(tracked_set)
          for path in final_paths:
              try:
                  data = open(path, "rb").read()
              except (FileNotFoundError, IsADirectoryError):
                  continue
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for a, b in exact:
                  text = text.replace(a, b)
              for rx, repl in token_rules:
                  text = rx.sub(repl, text)

              if path.startswith("sil/"):
                  text = re.sub(r"(?m)^package eth$", "package sil", text)
              if path.startswith("sil/silconfig/"):
                  text = re.sub(r"(?m)^package ethconfig$", "package silconfig", text)
              if path.startswith("internal/silapi/"):
                  text = re.sub(r"(?m)^package ethapi$", "package silapi", text)
              if path.startswith("silclient/"):
                  text = re.sub(r"(?m)^package ethclient$", "package silclient", text)
              if path.startswith("silstats/"):
                  text = re.sub(r"(?m)^package ethstats$", "package silstats", text)
              if path.startswith("cmd/devp2p/internal/siltest/"):
                  text = re.sub(r"(?m)^package ethtest$", "package siltest", text)

              if text != original:
                  open(path, "wb").write(text.encode("utf-8"))

          subprocess.check_call(["git", "add", "-A"])

          bad = []
          for path in final_paths:
              if (path == "eth" or path.startswith("eth/") or
                  path == "internal/ethapi" or path.startswith("internal/ethapi/") or
                  path == "ethclient" or path.startswith("ethclient/") or
                  path == "ethstats" or path.startswith("ethstats/") or
                  path == "cmd/geth" or path.startswith("cmd/geth/")):
                  bad.append(path)
          if bad:
              print("OLD_IDENTITY_PATHS_BEGIN")
              print("\n".join(bad))
              print("OLD_IDENTITY_PATHS_END")
              sys.exit(3)
          PY
          if [ $? -ne 0 ]; then
            echo "TOKEN_AWARE_TRANSFORM_FAILED"
            exit 1
          fi

          if git grep -n -E 'Recsipt|Recsipts|github.com/sila-chain/go-sil-kzg' -- ':!vendor' 2>/dev/null; then
            echo "CORRUPTION_GUARD_FAILED"
            exit 1
          fi

          RESULT_TREE="$(git write-tree)"
          RESULT_COMMIT="$(printf '%s\n' 'sync: rebuild Sila on go-ethereum v1.17.5 cleanly' | git commit-tree "$RESULT_TREE" -p "$CURRENT_HEAD")"
          echo "RESULT_TREE=$RESULT_TREE"
          echo "RESULT_COMMIT=$RESULT_COMMIT"
          git push origin "$RESULT_COMMIT:refs/heads/$BRANCH"
          if [ $? -ne 0 ]; then
            echo "RESULT_PUSH_FAILED"
            exit 1
          fi

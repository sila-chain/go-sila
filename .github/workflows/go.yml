on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          patterns='go-ethereum|Etherscan|etherscan|etherbase|gethstore|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|(^|[^[:alnum:]_])(Ethereum|ethereum|ETHEREUM|Ethash|ethash|Sepolia|Holesky|Hoodi|geth)([^[:alnum:]_]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!.mailmap' ':!signer/fourbyte/4byte.json' ':!accounts/usbwallet/ledger.go' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -F 'accounts/usbwallet/trezor/trezor.go:45://go:generate protoc ' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
    env:
      GSIL_MINGW: ${{ matrix.mingw }}
      GSIL_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GSIL_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GSIL_CC% -short -p 8


  devnet-merge-audit:
    name: Glamsterdam devnet 3-way merge audit
    if: github.event_name == 'pull_request' && github.head_ref == 'sila/glamsterdam-devnet-8-20260922'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream authority
        shell: bash
        run: |
          git remote add ethereum-upstream https://github.com/ethereum/go-ethereum.git
          git fetch --no-tags ethereum-upstream \
            9621c6ad10934a01b5514886fb6fbd87640b6c05 \
            aa1f2fcf512988eb8890d9352e601b898d6fdb2c

      - name: Audit 3-way applicability
        shell: python
        run: |
          import os
          import subprocess
          import tempfile

          BASE = "9621c6ad10934a01b5514886fb6fbd87640b6c05"
          HEAD = "aa1f2fcf512988eb8890d9352e601b898d6fdb2c"

          def map_path(p: str) -> str:
              exact = {
                  "core/state/reader_eip_7928.go": "core/state/reader_eip_7928.go",
                  "eth/handler_eth.go": "sil/handler_sil.go",
                  "eth/protocols/eth/handlers.go": "sil/protocols/sil/handlers.go",
                  "eth/protocols/eth/peer.go": "sil/protocols/sil/peer.go",
                  "eth/protocols/eth/protocol.go": "sil/protocols/sil/protocol.go",
                  "internal/ethapi/override/override.go": "internal/silapi/override/override.go",
                  "internal/ethapi/simulate.go": "internal/silapi/simulate.go",
              }
              if p in exact:
                  return exact[p]
              if p.startswith("cmd/geth/"):
                  p = "cmd/sila/" + p[len("cmd/geth/"):]
              elif p.startswith("eth/"):
                  p = "sil/" + p[len("eth/"):]
              elif p.startswith("internal/ethapi/"):
                  p = "internal/silapi/" + p[len("internal/ethapi/"):]
              p = p.replace("/ethconfig/", "/silconfig/")
              p = p.replace("/protocols/eth/", "/protocols/sil/")
              if "/eip" in p:
                  head, tail = p.rsplit("/", 1)
                  if tail.startswith("eip") and tail[3:4].isdigit():
                      tail = "sip" + tail[3:]
                      p = head + "/" + tail
              return p

          out = subprocess.check_output(
              ["git", "diff", "--name-status", BASE, HEAD],
              text=True,
          )
          rows = [line.split("\t") for line in out.splitlines() if line.strip()]
          conflicts = []
          missing = []
          clean = []
          added = []
          removed = []

          for row in rows:
              status, src = row[0], row[-1]
              dst = map_path(src)
              if status.startswith("A"):
                  added.append((src, dst))
                  continue
              if not os.path.exists(dst):
                  missing.append((src, dst, status))
                  continue
              if status.startswith("D"):
                  removed.append((src, dst))
                  continue
              with tempfile.TemporaryDirectory() as td:
                  local = os.path.join(td, "local")
                  base = os.path.join(td, "base")
                  remote = os.path.join(td, "remote")
                  with open(local, "wb") as w:
                      w.write(open(dst, "rb").read())
                  with open(base, "wb") as w:
                      w.write(subprocess.check_output(["git", "show", f"{BASE}:{src}"]))
                  with open(remote, "wb") as w:
                      w.write(subprocess.check_output(["git", "show", f"{HEAD}:{src}"]))
                  p = subprocess.run(
                      ["git", "merge-file", "-p", local, base, remote],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE,
                  )
                  if p.returncode == 0:
                      clean.append((src, dst))
                  else:
                      conflicts.append((src, dst, p.returncode, p.stderr.decode(errors="replace")))

          print(f"TOTAL_CHANGED={len(rows)}")
          print(f"CLEAN_3WAY={len(clean)}")
          print(f"ADDED={len(added)}")
          print(f"REMOVED={len(removed)}")
          print(f"MISSING_TARGET={len(missing)}")
          print(f"CONFLICTS={len(conflicts)}")
          print("=== ADDED ===")
          for x in added:
              print("\t".join(x))
          print("=== REMOVED ===")
          for x in removed:
              print("\t".join(x))
          print("=== MISSING ===")
          for x in missing:
              print("\t".join(x))
          print("=== CONFLICTS ===")
          for src, dst, rc, err in conflicts:
              print(f"{src}\t{dst}\trc={rc}\t{err.strip()}")

          if missing:
              raise SystemExit("mapped Sila targets are missing")


  devnet-apply-clean-delta:
    name: Apply clean Glamsterdam delta
    needs: devnet-merge-audit
    if: github.event_name == 'pull_request' && github.head_ref == 'sila/glamsterdam-devnet-8-20260922'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - name: Apply clean upstream delta only
        shell: python
        run: |
          import os
          import subprocess
          import tempfile

          BASE = "9621c6ad10934a01b5514886fb6fbd87640b6c05"
          HEAD = "aa1f2fcf512988eb8890d9352e601b898d6fdb2c"
          BRANCH = "sila/glamsterdam-devnet-8-20260922"

          subject = subprocess.check_output(["git", "log", "-1", "--pretty=%s"], text=True).strip()
          if subject == "sync: apply clean glamsterdam delta":
              print("clean delta already applied")
              raise SystemExit(0)

          subprocess.check_call(["git", "remote", "add", "ethereum-upstream", "https://github.com/ethereum/go-ethereum.git"])
          subprocess.check_call(["git", "fetch", "--no-tags", "ethereum-upstream", BASE, HEAD])

          def map_path(p: str) -> str:
              exact = {
                  "core/state/reader_eip_7928.go": "core/state/reader_eip_7928.go",
                  "eth/handler_eth.go": "sil/handler_sil.go",
                  "eth/protocols/eth/handlers.go": "sil/protocols/sil/handlers.go",
                  "eth/protocols/eth/peer.go": "sil/protocols/sil/peer.go",
                  "eth/protocols/eth/protocol.go": "sil/protocols/sil/protocol.go",
                  "internal/ethapi/override/override.go": "internal/silapi/override/override.go",
                  "internal/ethapi/simulate.go": "internal/silapi/simulate.go",
              }
              if p in exact:
                  return exact[p]
              if p.startswith("cmd/geth/"):
                  p = "cmd/sila/" + p[len("cmd/geth/"):]
              elif p.startswith("eth/"):
                  p = "sil/" + p[len("eth/"):]
              elif p.startswith("internal/ethapi/"):
                  p = "internal/silapi/" + p[len("internal/ethapi/"):]
              p = p.replace("/ethconfig/", "/silconfig/")
              p = p.replace("/protocols/eth/", "/protocols/sil/")
              if "/eip" in p:
                  head, tail = p.rsplit("/", 1)
                  if tail.startswith("eip") and tail[3:4].isdigit():
                      tail = "sip" + tail[3:]
                      p = head + "/" + tail
              return p

          out = subprocess.check_output(["git", "diff", "--name-status", BASE, HEAD], text=True)
          rows = [line.split("\t") for line in out.splitlines() if line.strip()]
          applied = []
          removed = []
          conflicts = []
          gofiles = []

          for row in rows:
              status, src = row[0], row[-1]
              dst = map_path(src)
              if status.startswith("A"):
                  continue
              if status.startswith("D"):
                  if os.path.exists(dst):
                      os.remove(dst)
                      subprocess.check_call(["git", "add", "-A", "--", dst])
                      removed.append(dst)
                  continue
              if not os.path.exists(dst):
                  raise SystemExit(f"mapped target missing: {src} -> {dst}")

              with tempfile.TemporaryDirectory() as td:
                  local = os.path.join(td, "local")
                  base = os.path.join(td, "base")
                  remote = os.path.join(td, "remote")
                  merged = os.path.join(td, "merged")
                  with open(local, "wb") as w:
                      w.write(open(dst, "rb").read())
                  with open(base, "wb") as w:
                      w.write(subprocess.check_output(["git", "show", f"{BASE}:{src}"]))
                  with open(remote, "wb") as w:
                      w.write(subprocess.check_output(["git", "show", f"{HEAD}:{src}"]))
                  with open(merged, "wb") as w:
                      p = subprocess.run(["git", "merge-file", "-p", local, base, remote], stdout=w)
                  if p.returncode == 0:
                      with open(dst, "wb") as w:
                          w.write(open(merged, "rb").read())
                      subprocess.check_call(["git", "add", "--", dst])
                      applied.append(dst)
                      if dst.endswith(".go"):
                          gofiles.append(dst)
                  else:
                      conflicts.append(dst)

          if gofiles:
              subprocess.check_call(["gofmt", "-w", *gofiles])
              subprocess.check_call(["git", "add", "--", *gofiles])

          print(f"APPLIED_CLEAN={len(applied)}")
          print(f"REMOVED={len(removed)}")
          print(f"LEFT_CONFLICTS={len(conflicts)}")
          for p in conflicts:
              print(f"CONFLICT\t{p}")

          if not subprocess.check_output(["git", "status", "--porcelain"], text=True).strip():
              print("no changes to commit")
              raise SystemExit(0)

          subprocess.check_call(["git", "config", "user.name", "Sila CI"])
          subprocess.check_call(["git", "config", "user.email", "ci@sila.local"])
          subprocess.check_call(["git", "commit", "-m", "sync: apply clean glamsterdam delta"])
          subprocess.check_call(["git", "push", "origin", f"HEAD:{BRANCH}"])

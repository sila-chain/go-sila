name: Migrate Ethereum-owned dependencies to Sila

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-rebuild-20260917

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Migrate dependencies and regenerate module sums
        shell: bash
        run: |
          set -u
          BRANCH="sila/go-sila-v1.17.5-rebuild-20260917"
          CURRENT_HEAD="$GITHUB_SHA"
          SILA_BASE="7a388df6c1afbf78af7b120d7119fe1c363d0a12"
          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'github.com/crate-crypto/go-eth-kzg': 'github.com/sila-chain/go-sil-kzg',
              'github.com/ethereum/c-kzg-4844/v2': 'github.com/sila-chain/c-kzg-4844/v2',
              'github.com/ethereum/go-bigmodexpfix': 'github.com/sila-chain/go-bigmodexpfix',
              'github.com/ethereum/hid': 'github.com/sila-chain/hid',
          }
          exts = {'.go','.mod','.sum','.md','.yml','.yaml','.toml','.json','.txt','.sh','.py','.tpl'}
          for p in Path('.').rglob('*'):
              if '.git' in p.parts or not p.is_file() or p.is_symlink():
                  continue
              if p.suffix not in exts and p.name not in {'go.mod','go.sum','Dockerfile','Dockerfile.alltools','Makefile'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements.items():
                  new = new.replace(old, repl)
              if p.as_posix() == 'go.mod':
                  new = new.replace('github.com/sila-chain/go-sil-kzg v1.5.0', 'github.com/sila-chain/go-sil-kzg v1.5.1')
                  new = new.replace('github.com/sila-chain/go-bigmodexpfix v0.0.0-20250911101455-f9e208c548ab', 'github.com/sila-chain/go-bigmodexpfix v0.0.1')
                  new = new.replace('github.com/sila-chain/hid v1.0.1-0.20260421154323-c2ab8d9bf68a', 'github.com/sila-chain/hid v1.0.1-sila.3')
              if new != text:
                  p.write_text(new, encoding='utf-8')
          PY

          go mod tidy
          ROOT_TIDY=$?
          if [ "$ROOT_TIDY" -ne 0 ]; then
            echo "ROOT_GO_MOD_TIDY_FAILED"
            exit "$ROOT_TIDY"
          fi

          if [ -f cmd/keeper/go.mod ]; then
            (cd cmd/keeper && go mod tidy)
            KEEPER_TIDY=$?
            if [ "$KEEPER_TIDY" -ne 0 ]; then
              echo "KEEPER_GO_MOD_TIDY_FAILED"
              exit "$KEEPER_TIDY"
            fi
          fi

          echo "ETHEREUM_GITHUB_RESIDUAL_BEGIN"
          grep -RIn --exclude-dir=.git --exclude='*.sum' 'github.com/ethereum/' . || true
          echo "ETHEREUM_GITHUB_RESIDUAL_END"
          if grep -RIl --exclude-dir=.git --exclude='*.sum' 'github.com/ethereum/' . | grep -q .; then
            echo "ETHEREUM_GITHUB_RESIDUAL_GATE=FAIL"
            exit 2
          fi
          echo "ETHEREUM_GITHUB_RESIDUAL_GATE=PASS"

          # Restore the normal Sila CI workflow before creating the result commit.
          git checkout "$SILA_BASE" -- .github/workflows/go.yml
          git add -A
          RESULT_TREE="$(git write-tree)"
          RESULT_COMMIT="$(printf '%s\n' 'deps: migrate Ethereum-owned dependencies to Sila' | git commit-tree "$RESULT_TREE" -p "$CURRENT_HEAD")"
          echo "RESULT_COMMIT=$RESULT_COMMIT"
          git push origin "$RESULT_COMMIT:refs/heads/$BRANCH"

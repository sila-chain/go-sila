on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          patterns='go-ethereum|Etherscan|etherscan|etherbase|gethstore|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|(^|[^[:alnum:]_])(Ethereum|ethereum|ETHEREUM|Ethash|ethash|Sepolia|Holesky|Hoodi|geth)([^[:alnum:]_]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!.mailmap' ':!signer/fourbyte/4byte.json' ':!accounts/usbwallet/ledger.go' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -F 'accounts/usbwallet/trezor/trezor.go:45://go:generate protoc ' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
    env:
      GSIL_MINGW: ${{ matrix.mingw }}
      GSIL_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Compare canonical fixture authority
        if: matrix.test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'sila-fixture-authority'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'general') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'blockchain') | Out-Null
          $generalUrl = 'https://raw.githubusercontent.com/ethereum/tests/81862e4848585a438d64f911a19b3825f0f4cd95/fixtures_general_state_tests.tgz'
          $blockUrl = 'https://raw.githubusercontent.com/ethereum/tests/81862e4848585a438d64f911a19b3825f0f4cd95/fixtures_blockchain_tests.tgz'
          Invoke-WebRequest -Uri $generalUrl -OutFile (Join-Path $root 'general.tgz')
          Invoke-WebRequest -Uri $blockUrl -OutFile (Join-Path $root 'blockchain.tgz')
          tar -xzf (Join-Path $root 'general.tgz') -C (Join-Path $root 'general')
          tar -xzf (Join-Path $root 'blockchain.tgz') -C (Join-Path $root 'blockchain')

          function Show-StateSummary([string]$label, [string]$path) {
            if (-not (Test-Path $path)) {
              Write-Host "$label MISSING=$path"
              return
            }
            $doc = Get-Content -Raw $path | ConvertFrom-Json
            foreach ($prop in $doc.PSObject.Properties) {
              $tc = $prop.Value
              Write-Host "$label TEST=$($prop.Name)"
              if ($tc._info) {
                Write-Host "$label INFO generated=$($tc._info.generatedTestHash) sourceHash=$($tc._info.sourceHash) source=$($tc._info.source)"
              }
              foreach ($fork in $tc.post.PSObject.Properties) {
                $items = @($fork.Value)
                for ($i = 0; $i -lt $items.Count; $i++) {
                  $x = $items[$i]
                  Write-Host "$label POST fork=$($fork.Name) index=$i hash=$($x.hash) logs=$($x.logs) data=$($x.indexes.data) gas=$($x.indexes.gas) value=$($x.indexes.value)"
                  if ($x.txbytes) {
                    Write-Host "$label TX fork=$($fork.Name) index=$i txbytes=$($x.txbytes)"
                  }
                }
              }
            }
          }

          $stateTargets = @(
            @{ Name='InitCollision.json'; Current='tests/testdata/GeneralStateTests/stSStoreTest/InitCollision.json' },
            @{ Name='dynamicAccountOverwriteEmpty.json'; Current='tests/testdata/GeneralStateTests/stExtCodeHash/dynamicAccountOverwriteEmpty.json' },
            @{ Name='create2collisionStorage.json'; Current='tests/testdata/GeneralStateTests/stCreate2/create2collisionStorage.json' }
          )
          foreach ($target in $stateTargets) {
            $up = Get-ChildItem (Join-Path $root 'general') -Recurse -File -Filter $target.Name | Select-Object -First 1
            if ($null -eq $up) {
              Write-Host "UPSTREAM_STATE MISSING=$($target.Name)"
            } else {
              Write-Host "UPSTREAM_STATE_PATH=$($up.FullName)"
              Show-StateSummary 'UPSTREAM_STATE' $up.FullName
            }
            Show-StateSummary 'SILA_STATE' $target.Current
          }

          $blockNames = @(
            'InitCollision.json',
            'dynamicAccountOverwriteEmpty.json',
            'create2collisionStorage.json',
            'blockChainFrontierWithLargerTDvsHomesteadBlockchain2.json',
            'blockChainFrontierWithLargerTDvsHomesteadBlockchain.json',
            'powToPosBlockRejection.json',
            'lotsOfLeafs.json'
          )
          foreach ($name in $blockNames) {
            $matches = @(Get-ChildItem (Join-Path $root 'blockchain') -Recurse -File -Filter $name)
            foreach ($match in $matches) {
              $hash = (Get-FileHash -Algorithm SHA256 $match.FullName).Hash
              Write-Host "UPSTREAM_BLOCK FILE=$name PATH=$($match.FullName) SHA256=$hash"
            }
            $currentMatches = @(Get-ChildItem 'tests/testdata/BlockchainTests' -Recurse -File -Filter $name)
            foreach ($match in $currentMatches) {
              $hash = (Get-FileHash -Algorithm SHA256 $match.FullName).Hash
              Write-Host "SILA_BLOCK FILE=$name PATH=$($match.FullName) SHA256=$hash"
            }
          }

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GSIL_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go test -timeout=15m -tags=ckzg -tags=integrationtests -p 8 -short ./tests -run "^(TestBlockchain|TestState)$"

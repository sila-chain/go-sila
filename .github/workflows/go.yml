name: Apply remaining Sila closure fixes

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-rebuild-20260917

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Apply targeted fixes
        shell: bash
        run: |
          set -u
          BRANCH="sila/go-sila-v1.17.5-rebuild-20260917"
          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"

          python3 <<'PY'
          from pathlib import Path
          import re

          hoodi_files = [
              "cmd/keeper/README.md",
              "cmd/keeper/getpayload_example.go",
              "cmd/sila/main.go",
              "cmd/utils/flags.go",
              "core/forkid/forkid_test.go",
              "core/genesis.go",
              "internal/silapi/api_test.go",
              "params/bootnodes.go",
              "params/config.go",
          ]
          for name in hoodi_files:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              p.write_text(text.replace("Hoodi", "SilaHoodi"), encoding="utf-8")

          p = Path("core/state/snapshot/journal.go")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r"https://etherscan\.io/tx/(0x[0-9a-fA-F]+)", r"transaction \1", text)
          p.write_text(text, encoding="utf-8")

          p = Path("docs/postmortems/2021-08-22-split-postmortem.md")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r"\[([^\]]+)\]\(https://etherscan\.io/[^)]+\)", r"\1", text)
          had_nl = text.endswith("\n")
          text = "\n".join(line.rstrip() for line in text.splitlines())
          if had_nl:
              text += "\n"
          p.write_text(text, encoding="utf-8")

          secret_ref = "$" + "{{ secrets.SILA_ARCHIVE_STORE }}"
          for name in [".gitea/workflows/release.yml", ".gitea/workflows/release-azure-cleanup.yml"]:
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              text = text.replace("gethstore/builds", secret_ref + "/builds")
              p.write_text(text, encoding="utf-8")

          p = Path("build/bot/macos-build.sh")
          text = p.read_text(encoding="utf-8").replace("gethstore/builds", "${SILA_ARCHIVE_STORE}/builds")
          p.write_text(text, encoding="utf-8")

          p = Path("build/ci.go")
          text = p.read_text(encoding="utf-8").replace('usually "gethstore/builds"', 'for example "account/builds"')
          p.write_text(text, encoding="utf-8")
          PY

          go run golang.org/x/tools/cmd/goimports@v0.41.0 -w \
            consensus/beacon/consensus.go \
            params/forks/forks.go \
            triedb/hashdb/database.go \
            cmd/keeper/getpayload_example.go \
            cmd/sila/main.go \
            cmd/utils/flags.go \
            core/forkid/forkid_test.go \
            core/genesis.go \
            internal/silapi/api_test.go \
            params/bootnodes.go \
            params/config.go \
            core/state/snapshot/journal.go \
            build/ci.go

          git diff --check
          git add -u
          git diff --cached --check
          git commit -m "identity: close remaining Sila residues and formatting"
          git push origin "HEAD:$BRANCH"

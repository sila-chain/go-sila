on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Free runner capacity by cancelling superseded PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: false

    # Cache build tools to avoid downloading them each time
    - uses: actions/cache@v4
      with:
        path: build/cache
        key: ${{ runner.os }}-build-tools-cache-${{ hashFiles('build/checksums.txt') }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25
        cache: false

    - name: Run linters
      run: |
        go run build/ci.go lint
        go run build/ci.go check_generate
        go run build/ci.go check_baddeps

  identity:
    name: Strict Sila identity audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Reject controlled legacy identity residues
        shell: bash
        run: |
          patterns='go-ethereum|Etherscan|etherscan|etherbase|gethstore|gethArchiveFiles|basegeth|gethImage|gethTool|gethArgs|testgeth|runGeth|gethver|gethversion|(^|[^[:alnum:]_])(Ethereum|ethereum|ETHEREUM|Ethash|ethash|Sepolia|Holesky|Hoodi|geth)([^[:alnum:]_]|$)'
          matches="$(git grep -n -I -E "$patterns" -- ':!.github/workflows/go.yml' ':!go.sum' ':!COPYING' ':!COPYING.LESSER' ':!AUTHORS' ':!.mailmap' ':!signer/fourbyte/4byte.json' ':!accounts/usbwallet/ledger.go' || true)"
          matches="$(printf '%s\n' "$matches" | grep -v -F 'accounts/usbwallet/trezor/trezor.go:45://go:generate protoc ' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "::error::Controlled legacy identity residue detected"
            exit 1
          fi

  keeper:
    name: Keeper Builds
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        run: go run build/ci.go keeper

  test-32bit:
    name: "32bit tests"
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install gcc-multilib

      - name: Build
        run: go run build/ci.go test -arch 386 -short -p 8

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go:
          - '1.25'
          - '1.24'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Run tests
        run: go run build/ci.go test -p 8

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            mingw: 'C:\mingw64'
            test: true
    env:
      GSIL_MINGW: ${{ matrix.mingw }}
      GSIL_CC: ${{ matrix.mingw }}\bin\gcc.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch ${{ matrix.arch }} -cc %GSIL_CC%

      - name: Run tests
        if: matrix.test
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go test -arch ${{ matrix.arch }} -cc %GSIL_CC% -short -p 8



  devnet-transform-audit:
    name: Glamsterdam Sila transform audit
    if: github.event_name == 'pull_request' && github.head_ref == 'sila/glamsterdam-devnet-8-20260922'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: false

      - name: Fetch upstream authority
        shell: bash
        run: |
          git remote add ethereum-upstream https://github.com/ethereum/go-ethereum.git
          git fetch --no-tags ethereum-upstream \
            9621c6ad10934a01b5514886fb6fbd87640b6c05 \
            aa1f2fcf512988eb8890d9352e601b898d6fdb2c

      - name: Audit Sila transform against stable authority
        shell: python
        run: |
          import difflib
          import os
          import re
          import subprocess
          import tempfile

          UBASE = "9621c6ad10934a01b5514886fb6fbd87640b6c05"
          UHEAD = "aa1f2fcf512988eb8890d9352e601b898d6fdb2c"
          SILA_BASE = "2c2deea9ac4a2f41ce099734f3015338f490651f"

          def map_path(p: str) -> str:
              exact = {
                  "core/state/reader_eip_7928.go": "core/state/reader_eip_7928.go",
                  "eth/handler_eth.go": "sil/handler_sil.go",
                  "eth/protocols/eth/handlers.go": "sil/protocols/sil/handlers.go",
                  "eth/protocols/eth/peer.go": "sil/protocols/sil/peer.go",
                  "eth/protocols/eth/protocol.go": "sil/protocols/sil/protocol.go",
                  "internal/ethapi/override/override.go": "internal/silapi/override/override.go",
                  "internal/ethapi/simulate.go": "internal/silapi/simulate.go",
              }
              if p in exact:
                  return exact[p]
              if p.startswith("cmd/geth/"):
                  p = "cmd/sila/" + p[len("cmd/geth/"):]
              elif p.startswith("eth/"):
                  p = "sil/" + p[len("eth/"):]
              elif p.startswith("internal/ethapi/"):
                  p = "internal/silapi/" + p[len("internal/ethapi/"):]
              p = p.replace("/ethconfig/", "/silconfig/")
              p = p.replace("/protocols/eth/", "/protocols/sil/")
              head, tail = os.path.split(p)
              if tail.startswith("eip") and tail[3:4].isdigit():
                  tail = "sip" + tail[3:]
                  p = os.path.join(head, tail)
              return p

          FORKS = [
              "Frontier", "Homestead", "Byzantium", "Constantinople", "Petersburg",
              "Istanbul", "MuirGlacier", "Berlin", "London", "ArrowGlacier",
              "GrayGlacier", "Paris", "Shanghai", "Cancun", "Prague", "Osaka",
          ]

          def silaize(text: str) -> str:
              text = text.replace("github.com/ethereum/go-ethereum", "github.com/sila-chain/go-sila")
              text = text.replace("go-ethereum", "go-sila")

              # Package/module identities.
              for a, b in [
                  ("ethapi", "silapi"),
                  ("ethconfig", "silconfig"),
                  ("ethclient", "silclient"),
                  ("ethstats", "silstats"),
                  ("ethash", "silash"),
                  ("ethdb", "sildb"),
                  ("ethtest", "siltest"),
                  ("ethkey", "silkey"),
              ]:
                  text = re.sub(rf"\b{a}\b", b, text)
                  text = re.sub(rf"\b{a.capitalize()}\b", b.capitalize(), text)

              # Safe public identity words only.
              text = re.sub(r"\bEthereum\b", "Sila", text)
              text = re.sub(r"\bethereum\b", "sila", text)
              text = re.sub(r"\bGeth\b", "Sila", text)
              text = re.sub(r"\bgeth\b", "sila", text)
              text = re.sub(r"\bGETH\b", "SILA", text)

              # RPC / p2p namespace tokens, without touching words containing 'eth'.
              text = re.sub(r"\bETH(?=[0-9A-Z_])", "SIL", text)
              text = re.sub(r"\bEth(?=[A-Z0-9_])", "Sil", text)
              text = re.sub(r"\beth(?=[A-Z0-9_])", "sil", text)
              text = re.sub(r"\beth_", "sil_", text)
              text = text.replace("/eth/", "/sil/")
              text = re.sub(r"\beth\.", "sil.", text)
              text = re.sub(r"^package eth$", "package sil", text, flags=re.M)

              # Specification identity: references and current post-merge identifiers.
              text = re.sub(r"\bEIP-(\d+)", r"SIP-\1", text)
              text = re.sub(r"\beip(?=\d)", "sip", text)
              for n in ("2780", "7928", "7997", "8037", "8038", "7702", "4844", "1559"):
                  text = text.replace(f"EIP{n}", f"SIP{n}")
              text = re.sub(r"\bERC-7562\b", "SRC-7562", text)
              text = re.sub(r"\berc7562\b", "src7562", text)
              text = re.sub(r"\bERC7562\b", "SRC7562", text)

              # Network/fork identifiers used by the current Sila stable tree.
              text = text.replace("Mainnet", "SilaMainnet")
              text = re.sub(r"\bmainnet\b", "sila-mainnet", text)
              for name in ("Sepolia", "Holesky", "Hoodi"):
                  text = text.replace(name, "Sila" + name)
              for name in FORKS:
                  text = text.replace(name, "Sila" + name)

              # Known command/protocol identifier prefixes.
              text = re.sub(r"\bgeth(?=[A-Z0-9_])", "sila", text)
              text = re.sub(r"\bGeth(?=[A-Z0-9_])", "Sila", text)
              return text

          def gofmt_bytes(data: bytes, suffix: str) -> bytes:
              if not suffix.endswith(".go"):
                  return data
              p = subprocess.run(["gofmt"], input=data, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if p.returncode != 0:
                  return data
              return p.stdout

          diff = subprocess.check_output(["git", "diff", "--name-status", UBASE, UHEAD], text=True)
          rows = [line.split("\t") for line in diff.splitlines() if line.strip()]
          conflicts = []
          exact = []
          mismatch = []

          for row in rows:
              status, src = row[0], row[-1]
              if status.startswith(("A", "D")):
                  continue
              dst = map_path(src)
              try:
                  local = subprocess.check_output(["git", "show", f"{SILA_BASE}:{dst}"])
              except subprocess.CalledProcessError:
                  continue
              base = subprocess.check_output(["git", "show", f"{UBASE}:{src}"])
              remote = subprocess.check_output(["git", "show", f"{UHEAD}:{src}"])

              with tempfile.TemporaryDirectory() as td:
                  lp, bp, rp = [os.path.join(td, n) for n in ("local", "base", "remote")]
                  for path, data in ((lp, local), (bp, base), (rp, remote)):
                      open(path, "wb").write(data)
                  m = subprocess.run(["git", "merge-file", "-p", lp, bp, rp], stdout=subprocess.DEVNULL)
                  if m.returncode == 0:
                      continue
              conflicts.append((src, dst))

              try:
                  transformed = silaize(base.decode()).encode()
              except UnicodeDecodeError:
                  mismatch.append((src, dst, "non-utf8"))
                  continue
              transformed = gofmt_bytes(transformed, dst)
              local_norm = gofmt_bytes(local, dst)
              if transformed == local_norm:
                  exact.append((src, dst))
              else:
                  a = transformed.decode(errors="replace").splitlines()
                  b = local_norm.decode(errors="replace").splitlines()
                  first = next(iter(difflib.unified_diff(a, b, n=1)), "diff")
                  mismatch.append((src, dst, first[:180]))

          print(f"CONFLICT_FILES={len(conflicts)}")
          print(f"TRANSFORM_BASE_MATCH={len(exact)}")
          print(f"TRANSFORM_BASE_MISMATCH={len(mismatch)}")
          print("=== MATCH ===")
          for src, dst in exact:
              print(f"MATCH\t{src}\t{dst}")
          print("=== MISMATCH ===")
          for src, dst, why in mismatch:
              print(f"MISMATCH\t{src}\t{dst}\t{why}")

          if not conflicts:
              raise SystemExit("expected conflict set is empty")

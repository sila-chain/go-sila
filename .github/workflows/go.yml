on:
  push:
    branches:
      - sila/windows-amd64-only-20260919
  workflow_dispatch:

jobs:
  windows-amd64:
    name: Windows amd64
    runs-on: windows-2025
    env:
      GSIL_MINGW: 'C:\\mingw64'
      GSIL_CC: 'C:\\mingw64\\bin\\gcc.exe'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go install -arch amd64 -cc %GSIL_CC%

      - name: Run tests
        shell: cmd
        run: |
          set PATH=%GSIL_MINGW%\bin;%PATH%
          go run build/ci.go test -arch amd64 -cc %GSIL_CC% -short -p 8

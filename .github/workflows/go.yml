name: Apply targeted Sila identity normalization

on:
  push:
    branches:
      - sila/go-sila-v1.17.5-rebuild-20260917

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Normalize controlled Sila identity
        shell: bash
        run: |
          set -u
          BRANCH="sila/go-sila-v1.17.5-rebuild-20260917"
          CURRENT_HEAD="$GITHUB_SHA"
          git config user.name "SILA Network"
          git config user.email "214020442+sila-chain@users.noreply.github.com"

          python3 <<'PY'
          from pathlib import Path

          def replace(path, pairs):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"missing required file: {path}")
              text = p.read_text(encoding="utf-8")
              new = text
              for old, repl in pairs:
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding="utf-8")

          replace("accounts/accounts.go", [
              ("Ethereum Signed Message", "Sila Signed Message"),
          ])

          replace("internal/silapi/api.go", [
              ("NewEthereumAccountAPI", "NewSilaAccountAPI"),
              ("NewEthereumAPI", "NewSilaAPI"),
              ("Ethereum Signed Message", "Sila Signed Message"),
          ])
          replace("internal/silapi/backend.go", [
              ("NewEthereumAccountAPI", "NewSilaAccountAPI"),
              ("NewEthereumAPI", "NewSilaAPI"),
          ])
          replace("sil/backend.go", [
              ("gethversion", "silaversion"),
              ("etherbase", "silabase"),
          ])
          replace("build/ci.go", [
              ("debEthereum", "debSila"),
              ("basegeth", "baseSila"),
          ])
          replace("cmd/utils/flags.go", [
              ("setEtherbase", "setSilabase"),
              ("etherbase", "silabase"),
          ])
          replace("cmd/devp2p/internal/siltest/suite_test.go", [
              ("runGeth", "runSila"),
          ])

          for p in Path("cmd/sila").glob("*.go"):
              text = p.read_text(encoding="utf-8")
              new = text
              for old, repl in (
                  ("runMinimalGeth", "runMinimalSila"),
                  ("runGeth", "runSila"),
                  ("testgeth", "testSila"),
                  ("gethver", "silaver"),
                  ("initGeth", "initSila"),
              ):
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding="utf-8")

          # Sila-owned Debian completion files restored from upstream-named paths.
          bash_old = Path("build/deb/sila/completions/bash/geth")
          bash_new = Path("build/deb/sila/completions/bash/sila")
          if bash_old.exists() and not bash_new.exists():
              bash_old.rename(bash_new)
          if bash_new.exists():
              t = bash_new.read_text(encoding="utf-8")
              t = t.replace("_geth_bash_autocomplete", "_sila_bash_autocomplete")
              t = t.replace(" geth", " sila")
              bash_new.write_text(t, encoding="utf-8")

          zsh_old = Path("build/deb/sila/completions/zsh/_geth")
          zsh_new = Path("build/deb/sila/completions/zsh/_sila")
          if zsh_old.exists() and not zsh_new.exists():
              zsh_old.rename(zsh_new)
          if zsh_new.exists():
              t = zsh_new.read_text(encoding="utf-8")
              t = t.replace("_geth_zsh_autocomplete", "_sila_zsh_autocomplete")
              t = t.replace(" geth", " sila")
              zsh_new.write_text(t, encoding="utf-8")

          nsis_old = Path("build/nsis.geth.nsi")
          nsis_new = Path("build/nsis.sila.nsi")
          if nsis_old.exists() and not nsis_new.exists():
              nsis_old.rename(nsis_new)
          if not nsis_new.exists():
              raise SystemExit("missing Sila NSIS authority")
          t = nsis_new.read_text(encoding="utf-8")
          for old, repl in (
              ("geth", "sila"),
              ("Geth", "Sila"),
              ("Ethereum", "Sila"),
              ("ETHEREUM_SOCKET", "SILA_SOCKET"),
          ):
              t = t.replace(old, repl)
          nsis_new.write_text(t, encoding="utf-8")
          PY

          go run golang.org/x/tools/cmd/goimports@v0.41.0 -w \
            accounts/accounts.go \
            internal/silapi/api.go internal/silapi/backend.go \
            sil/backend.go build/ci.go cmd/utils/flags.go \
            cmd/devp2p/internal/siltest/suite_test.go cmd/sila/*.go

          git diff --check

          # The migration workflow is temporary. Restore the normal validation workflow.
          git checkout "$CURRENT_HEAD^" -- .github/workflows/go.yml
          git add -A
          git diff --cached --check
          git commit -m "identity: restore controlled Sila naming"
          git push origin "HEAD:$BRANCH"
